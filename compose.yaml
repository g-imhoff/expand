services:
  expand-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: expand-backend:local
    container_name: expand-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - expand-data:/data
    environment:
      EXPAND_HOST: "0.0.0.0"
      EXPAND_PORT: "3210"
      EXPAND_LOG_LEVEL: "${EXPAND_LOG_LEVEL:-Info}"
      OPENCODE_ZEN_API_KEY: "${OPENCODE_ZEN_API_KEY:-}"
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-}"
    healthcheck:
      test: ["CMD", "node", "dist/expand", "health", "--data-dir", "/data"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  expand-data:
    driver: local
