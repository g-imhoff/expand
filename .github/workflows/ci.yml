name: CI

on:
  push:
    branches: [develop, feat/architectural-foundation]
  pull_request:
    branches: [develop, feat/architectural-foundation]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:desktop
      - run: bun run arch
      - run: bun run test

  desktop-e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: bun run build:desktop
      - run: xvfb-run -a bun run e2e:desktop

  binary-smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ./scripts/binary-smoke.sh
